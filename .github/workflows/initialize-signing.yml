name: Initialize JG Release Signing Key

# Run only once, manually, from main. No plaintext keystore is committed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    name: Create encrypted persistent Android signing key
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      JG_RELEASE_STORE_PASSWORD: ${{ secrets.JG_RELEASE_STORE_PASSWORD }}
      JG_KEYSTORE_WRAP_SECRET: ${{ secrets.JG_KEYSTORE_WRAP_SECRET }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate secrets and ensure signing identity is not replaced
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f signing/jg-release.p12.gpg ]]; then
            echo 'Release key already exists. Refusing to rotate it.'
            exit 1
          fi
          store_length=$(printf '%s' "$JG_RELEASE_STORE_PASSWORD" | wc -c)
          wrap_length=$(printf '%s' "$JG_KEYSTORE_WRAP_SECRET" | wc -c)
          if [[ "$store_length" -lt 16 || "$wrap_length" -lt 24 ]]; then
            echo 'Missing or weak secrets. Add JG_RELEASE_STORE_PASSWORD (16+ chars) and JG_KEYSTORE_WRAP_SECRET (24+ random chars) in Repository Settings > Secrets and variables > Actions.'
            exit 1
          fi

      - name: Generate keystore and encrypt it with the repository secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing
          keyfile="$RUNNER_TEMP/jg-release.p12"
          trap 'rm -f "$RUNNER_TEMP/jg-release.p12"' EXIT
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "$keyfile" \
            -alias jg \
            -keyalg RSA -keysize 3072 \
            -validity 9125 \
            -storepass "$JG_RELEASE_STORE_PASSWORD" \
            -keypass "$JG_RELEASE_STORE_PASSWORD" \
            -dname 'CN=JG Kanta Android Release, OU=Apps, O=JG, C=IN'
          fingerprint=$(keytool -list -v -keystore "$keyfile" -alias jg \
            -storepass "$JG_RELEASE_STORE_PASSWORD" \
            | awk '/SHA256:/{print $2;exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo 'Failed to obtain signing fingerprint'; exit 1; }
          printf '%s\n' "$fingerprint" > signing/jg-release.sha256.txt
          printf '%s' "$JG_KEYSTORE_WRAP_SECRET" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output signing/jg-release.p12.gpg "$keyfile"
          printf '%s' "$JG_KEYSTORE_WRAP_SECRET" | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt signing/jg-release.p12.gpg > "$RUNNER_TEMP/test-release.p12"
          cmp -s "$keyfile" "$RUNNER_TEMP/test-release.p12"
          rm -f "$RUNNER_TEMP/test-release.p12"

      - name: Save encrypted key and public fingerprint in GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signing/jg-release.p12.gpg signing/jg-release.sha256.txt
          git commit -m 'Initialize encrypted JG Android release signing key'
          git push origin HEAD:main
          echo 'Only the AES-256-encrypted keystore and public SHA256 fingerprint were committed.'
          echo 'Keep independent backups of both repository secrets. Do not regenerate this certificate for future updates.'
