name: Build JG Kanta APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build JG Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify required project files
        shell: bash
        run: |
          for f in \
            build.gradle \
            settings.gradle \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/drawable-nodpi/jg_logo.png \
            app/src/main/java/com/example/bluetoothkanta/MainActivity.java \
            app/src/main/java/com/example/bluetoothkanta/BluetoothController.java \
            app/src/main/java/com/example/bluetoothkanta/LicenseVerifier.java \
            app/src/main/java/com/example/bluetoothkanta/LicenseStore.java \
            app/src/main/java/com/example/bluetoothkanta/NetUtil.java; do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
          done
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JG-Kanta-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
