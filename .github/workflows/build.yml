name: Build Bluetooth Kanta APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project files and Android SDK
        run: |
          test -f app/build.gradle || { echo 'MISSING app/build.gradle: upload the app folder from the ZIP'; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo 'MISSING AndroidManifest.xml: upload the app folder from the ZIP'; exit 1; }
          test -f app/src/main/java/com/example/bluetoothkanta/MainActivity.java || { echo 'MISSING MainActivity.java: upload the app folder from the ZIP'; exit 1; }
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothKanta-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
