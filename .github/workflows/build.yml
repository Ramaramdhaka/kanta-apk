name: Build JG Kanta APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, jg-v7-firebase-setup-20261121]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build debug + R8 release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android source and resource files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            build.gradle settings.gradle gradle.properties app/build.gradle app/proguard-rules.pro \
            app/src/main/AndroidManifest.xml \
            app/src/main/res/xml/network_security_config.xml \
            app/src/main/res/drawable-nodpi/jg_logo.png \
            app/src/main/java/com/example/bluetoothkanta/MainActivity.java \
            app/src/main/java/com/example/bluetoothkanta/LicenseStore.java \
            app/src/main/java/com/example/bluetoothkanta/LicenseVerifier.java \
            app/src/main/java/com/example/bluetoothkanta/Obfuscated.java \
            app/src/main/java/com/example/bluetoothkanta/SecurityGuard.java \
            app/src/main/java/com/example/bluetoothkanta/BluetoothController.java \
            app/src/main/java/com/example/bluetoothkanta/NetUtil.java; do
            test -f "$f" || { echo "ERROR: Missing $f"; exit 1; }
          done
          bad=$(find app/src/main/res -type f \
            ! -name '*.xml' ! -name '*.png' ! -name '*.webp' ! -name '*.jpg' \
            -print -quit)
          if [ -n "$bad" ]; then
            echo "ERROR: Invalid Android resource filename: $bad"
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JG-Kanta-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          KEY_B64: ${{ secrets.JG_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.JG_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JG_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JG_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEY_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No signing secrets configured.'
          fi

      - name: Restore release keystore from secret
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KEY_B64: ${{ secrets.JG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/jg-release.jks"
          chmod 600 "$RUNNER_TEMP/jg-release.jks"
          echo "JG_KEYSTORE_PATH=$RUNNER_TEMP/jg-release.jks" >> "$GITHUB_ENV"

      - name: Verify R8 minified release builds
        shell: bash
        env:
          JG_STORE_PASSWORD: ${{ secrets.JG_RELEASE_STORE_PASSWORD }}
          JG_KEY_ALIAS: ${{ secrets.JG_RELEASE_KEY_ALIAS }}
          JG_KEY_PASSWORD: ${{ secrets.JG_RELEASE_KEY_PASSWORD }}
          JG_EXPECTED_SIGNATURE_SHA256: ${{ secrets.JG_EXPECTED_SIGNATURE_SHA256 }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload signed release APK when configured
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JG-Kanta-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
